version: '3.8'

services:
  web:
    build: .
    container_name: outreach-platform-web
    ports:
      - " 8000:8000\
 environment:
 - ENVIRONMENT=production
 - GROQ_API_KEY=
 - GROQ_MODEL=
 - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/outreach_platform
 - SECRET_KEY=
 depends_on:
 db:
 condition: service_healthy
 restart: unless-stopped

 db:
 image: postgres:15-alpine
 container_name: outreach-platform-db
 environment:
 - POSTGRES_USER=postgres
 - POSTGRES_PASSWORD=postgres
 - POSTGRES_DB=outreach_platform
 ports:
 - \5432:5432\
 volumes:
 - postgres_data:/var/lib/postgresql/data
 healthcheck:
 test: [\CMD-SHELL\, \pg_isready -U postgres\]
 interval: 5s
 timeout: 5s
 retries: 5
 restart: unless-stopped

volumes:
 postgres_data:
